<!doctype html><html><head><meta charset="utf-8"><title>Option A variants</title><style>
body{margin:0;font:14px -apple-system,Helvetica,sans-serif;background:#f6f7f9}
.top{position:sticky;top:0;background:#fff;border-bottom:1px solid #e5e7eb;z-index:9;padding:8px 16px}
.tabs{display:flex;gap:8px}.tabs button{border:1px solid #d1d5db;background:#fff;border-radius:6px;padding:5px 12px;font:inherit;cursor:pointer}
.tabs button.on{background:#111;color:#fff;border-color:#111}
#d{font-size:12px;color:#555;margin-top:6px}iframe{display:block;width:100%;height:calc(100vh - 80px);border:0;background:#fff}
</style></head><body><div class="top"><div class="tabs" id="t"></div><div id="d"></div></div><iframe id="f"></iframe><script>
const V=[['v1 Torn edge','Zig-zag torn cut, neutral gray, small label above the bar.'],['v2 Dotted baseline','Idle = dotted line with a pill label on it; rounded green blocks.'],['v3 Warm-gray tray','Soft rounded tray + shadow, muted warm-gray breaks, no orange.'],['v4 Dots chip','Dots chip on dashed link, duration under axis, ticks at both break edges.'],['v5 Skyline rail (pick)','Idle as negative space: thin rail with // gap, duration floating above.']];
const t=document.getElementById('t');V.forEach((v,i)=>{const b=document.createElement('button');b.textContent=(i+1)+' · '+v[0];b.onclick=()=>go(i);t.appendChild(b)});
function go(i){document.querySelectorAll('button').forEach((b,j)=>b.classList.toggle('on',i===j));document.getElementById('f').src='mockup-timeline-a-v'+(i+1)+'.html';document.getElementById('d').textContent=V[i][1];location.hash='v'+(i+1)}
addEventListener('keydown',e=>{let c=+(location.hash.slice(2)||1)-1;if(e.key>='1'&&e.key<='5')go(+e.key-1);else if(e.key==='ArrowRight')go(Math.min(4,c+1));else if(e.key==='ArrowLeft')go(Math.max(0,c-1))});
go(Math.max(0,Math.min(4,(+location.hash.slice(2)||1)-1)));
</script></body></html>
